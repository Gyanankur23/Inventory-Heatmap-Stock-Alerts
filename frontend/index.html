<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Heatmap Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Inventory Heatmap & Stock-Out Alerts</h1>
  </header>

  <main>
    <section class="heatmap">
      <h2>Stock Level Heatmap</h2>
      <img src="../diagrams/heatmap_placeholder.png" alt="Heatmap" id="heatmap-image">
    </section>

    <section class="table-section">
      <h2>Inventory Forecast</h2>
      <table id="inventory-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Location</th>
            <th>Stock</th>
            <th>Days Until Out of Stock</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated by script.js -->
        </tbody>
      </table>
    </section>

    <section class="alerts-section">
      <h2>Stock-Out Alerts</h2>
      <ul id="alerts-list">
        <!-- Populated by script.js -->
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
