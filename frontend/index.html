<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Heatmap Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { color: #333; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #eee; }
    .alerts-section li { color: red; margin-bottom: 5px; }
    .diagram-img { width: 100%; max-width: 600px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Inventory Heatmap & Stock-Out Alerts</h1>
  </header>

  <main>
    <!-- Heatmap -->
    <section class="heatmap">
      <h2>Stock Level Heatmap</h2>
      <img src="../diagrams/heatmap.jpg" alt="Heatmap" id="heatmap-image">
    </section>

    <!-- Inventory Table -->
    <section class="table-section">
      <h2>Inventory Forecast</h2>
      <table id="inventory-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Location</th>
            <th>Stock</th>
            <th>Days Until Out of Stock</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Alerts -->
    <section class="alerts-section">
      <h2>Stock-Out Alerts</h2>
      <ul id="alerts-list"></ul>
    </section>

    <!-- Diagrams Section -->
    <section class="diagrams-section">
      <h2>System Diagrams</h2>
      <h3>Architecture</h3>
      <img src="../diagrams/architecture.jpg" alt="Architecture Diagram" class="diagram-img">
      <h3>Process Flow</h3>
      <img src="../diagrams/process_flow.jpg" alt="Process Flow Diagram" class="diagram-img">
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
