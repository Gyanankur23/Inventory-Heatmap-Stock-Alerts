<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Heatmap Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>Inventory Boss Dashboard</h1>
      <nav>
        <button class="nav-btn" data-target="heatmap-section">Heatmap</button>
        <button class="nav-btn" data-target="inventory-section">Inventory</button>
        <button class="nav-btn" data-target="alerts-section">Alerts</button>
        <button class="nav-btn" data-target="diagrams-section">Diagrams</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Heatmap -->
    <section class="page-section" id="heatmap-section">
      <h2>Stock Level Heatmap</h2>
      <img src="diagrams/heatmap.jpg" alt="Heatmap" class="diagram-img">
    </section>

    <!-- Inventory Table -->
    <section class="page-section" id="inventory-section">
      <h2>Inventory Forecast</h2>
      <table id="inventory-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Location</th>
            <th>Stock</th>
            <th>Days Until Out of Stock</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Alerts -->
    <section class="page-section" id="alerts-section">
      <h2>Stock-Out Alerts</h2>
      <ul id="alerts-list" class="alerts-list"></ul>
    </section>

    <!-- Diagrams Section -->
    <section class="page-section" id="diagrams-section">
      <h2>System Diagrams</h2>
      <div class="diagram-grid">
        <div>
          <h3>Architecture</h3>
          <img src="diagrams/architecture.jpg" alt="Architecture Diagram" class="diagram-img">
        </div>
        <div>
          <h3>Process Flow</h3>
          <img src="diagrams/process_flow.jpg" alt="Process Flow Diagram" class="diagram-img">
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
